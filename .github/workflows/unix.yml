name: Unix

on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        python-version: [3.11]
        os: [ubuntu-22.04]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Cache conda
      uses: actions/cache@v3
      # Increase this value to reset cache
      env: {CACHE_NUMBER: 0}
      with:
        path: ~/conda_pkgs_dir
        key: ${{ runner.os }}-conda-${{ env.CACHE_NUMBER }}-${{ matrix.python-version }}

    - uses: conda-incubator/setup-miniconda@v2
      name: Setup conda
      with:
        auto-update-conda: true
        activate-environment: testing
        auto-activate-base: false
        channels: conda-forge,defaults
        channel-priority: true

    - shell: bash -eo pipefail -l {0}
      name: Install dependencies
      run: |
        conda install --yes -c conda-forge numba scipy h5py mkl mpich mpi4py matplotlib python=${{ matrix.python-version }} pip
        pip install openPMD-viewer pytest pyflakes lasy
        python -m pip install .

    - shell: bash -eo pipefail -l {0}
      name: pyflakes
      run: python -m pyflakes .

    - shell: bash -o pipefail -l {0}
      name: FBPIC physics tests
      run: |
        export NUMBA_THREADING_LAYER=omp
        export MKL_NUM_THREADS=2
        export OPENPMD_VERIFY_HOMOGENEOUS_EXTENTS=0

        echo "========== SYSTEM =========="
        uname -a
        echo "CPUs:"
        nproc
        echo "Memory:"
        free -h

        echo "========== PYTHON =========="
        which python
        python --version
        python -c "print('Python OK')"
        echo "exit: $?"

        echo "========== NUMPY =========="
        python -c "import numpy; print('numpy', numpy.__version__)"
        echo "exit: $?"

        echo "========== SCIPY =========="
        python -c "import scipy; print('scipy', scipy.__version__)"
        echo "exit: $?"

        echo "========== NUMBA =========="
        python -c "import numba; print('numba', numba.__version__)"
        echo "exit: $?"

        echo "========== MPI4PY =========="
        python -c "import mpi4py; print('mpi4py', mpi4py.__version__)"
        echo "exit: $?"

        echo "========== FBPIC =========="
        python -c "import fbpic; print('fbpic:', fbpic.__file__)"
        echo "exit: $?"

        echo "========== PYTEST =========="
        python -m pytest --version
        echo "exit: $?"

        echo "========== TEST COLLECTION =========="
        python -m pytest --collect-only -vv \
          tests --ignore=tests/unautomated
        echo "collection exit: $?"

        echo "========== RUN TESTS =========="
        python -m pytest -vv -s \
          tests --ignore=tests/unautomated
        status=$?

        echo "========== AFTER PYTEST =========="
        echo "pytest exit code: $status"
        free -h

        exit $status
    - shell: bash -eo pipefail -l {0}
      name: PICMI test
      run: |
        pip install wget "picmistandard<=0.34.0" numexpr periodictable
        cd tests/unautomated
        curl https://raw.githubusercontent.com/picmi-standard/picmi/0.34.0/Examples/laser_acceleration/laser_acceleration_PICMI.py -o fbpic_script.py
        python test_picmi.py
        rm fbpic_script.py

    - shell: bash -eo pipefail -l {0}
      name: PICMI boosted test
      run: |
        cd tests/unautomated
        curl https://raw.githubusercontent.com/picmi-standard/picmi/0.34.0/Examples/laser_acceleration/lpa_boostedframe_PICMI.py -o fbpic_script.py
        cat fbpic_script.py
        python test_picmi.py
        rm fbpic_script.py
